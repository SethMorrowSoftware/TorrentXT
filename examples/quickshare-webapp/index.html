<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3b82f6">
  <title>TorrentXT Web App Demo</title>
  <meta name="description" content="A single-page demo app served by TorrentXT Quick Share over Tor or a direct web link.">
  <!-- All asset paths are RELATIVE, so the app works both at the root (over Tor) and
       under /<token>/ (over the direct web link) without any build step or <base>. -->
  <link rel="icon" href="assets/logo.svg">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="site">
    <a class="brand" data-route="" href="./">
      <img src="assets/logo.svg" width="34" height="34" alt="">
      <span>TorrentXT&nbsp;<b>Demo</b></span>
    </a>
    <span id="transport" class="badge" title="How this page reached your browser">detecting...</span>
  </header>
  <nav id="nav" class="nav" aria-label="Sections"></nav>
  <main id="view" class="view">
    <noscript><div class="card">This demo uses JavaScript for its client-side routing. The
      folder still serves as plain files without it.</div></noscript>
  </main>
  <footer class="site-ft">
    <span>Served by <b>TorrentXT</b> Quick Share &mdash; static assets, HTTP Range, SPA routing, and a live backend.</span>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
